resources:
  jobs:
    varejo_data_platform_daily:
      name: varejo-data-platform-daily
      email_notifications:
        on_failure:
          - johnatan.flores@gmail.com
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/johnatan.flores@gmail.com/varejo-data-platform/notebooks/01_bronze_ingestion
            source: WORKSPACE
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/johnatan.flores@gmail.com/varejo-data-platform/notebooks/02_silver_transformations
            source: WORKSPACE
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: /Workspace/Users/johnatan.flores@gmail.com/varejo-data-platform/notebooks/03_gold_kpis
            source: WORKSPACE
        - task_key: quality
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: /Workspace/Users/johnatan.flores@gmail.com/varejo-data-platform/notebooks/04_data_quality
            source: WORKSPACE
        - task_key: alerts
          depends_on:
            - task_key: quality
          run_if: ALL_DONE
          notebook_task:
            notebook_path: /Workspace/Users/johnatan.flores@gmail.com/varejo-data-platform/notebooks/05_alerts
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
